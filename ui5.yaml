# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "3.1"

metadata:
  name: supplieropenitems

type: application

framework:
  name: SAPUI5
  version: "1.130.9"
  libraries:
    - name: sap.ui.core
    - name: sap.m
    - name: sap.f
    - name: sap.ui.table
    - name: sap.viz

server:
  customMiddleware:

    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertErrors: true
        ui5:
          path:
            - /resources
            - /test-resources
          url: https://sapui5.hana.ondemand.com/1.120.49
        backend:
          - path: /sap
            url: http://emsquadev.everestspices.in:8000
            client: '120'

    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300

    - name: fiori-tools-preview
      afterMiddleware: fiori-tools-appreload
      configuration:
        flp:
          theme: sap_horizon